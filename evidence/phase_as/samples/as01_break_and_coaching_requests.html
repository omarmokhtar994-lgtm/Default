<!doctype html>

<html lang="en"><head><meta charset="utf-8"><title>Sample as01: break change and coaching requests</title>
<style>
body{font:14px system-ui,sans-serif;margin:24px;background:var(--bg);color:var(--ink)}
body.light{--bg:#F1F2F4;--ink:#1B1F24;--panel:#fff;--rail:#d6d9de;--dim:#59616b;--hi:#17805f;--mid:#9a6a00;--lo:#b3261e;--hi-bg:#dcf3ea;--mid-bg:#fbefd3;--lo-bg:#fbe0dd;--chip:#e8ebef}
body.dark{--bg:#111418;--ink:#E8EAED;--panel:#191D22;--rail:#3a4048;--dim:#98A2AF;--hi:#2BC4B4;--mid:#F2A93B;--lo:#FF8A82;--hi-bg:#123a36;--mid-bg:#3b2f12;--lo-bg:#41201e;--chip:#252a31}
.opt{background:var(--panel);border:1px solid var(--rail);border-radius:8px;padding:14px 16px;margin:0 0 18px;max-width:1000px}
h2{font-size:17px;margin:0 0 4px}h3{font-size:14px;margin:12px 0 4px}p{margin:0 0 10px;font-size:13px;color:var(--dim)}
.day{display:flex;gap:2px;margin:8px 0}.day span{flex:1;height:26px;border-radius:3px;font-size:10px;text-align:center;line-height:26px;color:#fff}
.work{background:#3987e5}.brk{background:#c98500}.past{background:#7a8594;opacity:.6}
table{border-collapse:collapse;font-size:13px;width:100%}th,td{border-bottom:1px solid var(--rail);padding:6px 8px;text-align:left}
.lv{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;border:1px solid}
.hi{color:var(--hi);background:var(--hi-bg);border-color:var(--hi)}.mid{color:var(--mid);background:var(--mid-bg);border-color:var(--mid)}.lo{color:var(--lo);background:var(--lo-bg);border-color:var(--lo)}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.slot{border:1px solid var(--rail);border-radius:6px;padding:6px 10px;font-size:13px}
.slot.on{outline:2px solid var(--ink)}.warn{border-left:3px solid var(--lo);padding:6px 10px;margin:8px 0;font-size:13px;color:var(--ink);background:var(--lo-bg)}
.btn{display:inline-block;border:1px solid var(--ink);border-radius:6px;padding:6px 12px;font-size:13px;margin-right:6px}.btn.p{background:var(--ink);color:var(--bg)}
.sel{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}.sel label{font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:3px}.sel .box{border:1px solid var(--rail);border-radius:6px;padding:6px 10px;color:var(--ink);font-size:13px}
.bar{display:inline-block;height:10px;border-radius:2px;vertical-align:middle}
.chip{background:var(--chip);border-radius:10px;padding:1px 8px;font-size:11px}
</style></head><body class="light">
<div id="out"></div>
<script>
const cell=(t,req,now)=>({t,req,now});
const rows=[["22:00",6,8],["22:30",6,7],["23:00",6,6],["23:30",6,7],["00:00",5,5],["00:30",5,6],["01:00",4,4],["01:30",4,6],["02:00",4,7]];
const lvl=d=>d>=1?['hi','High buffer']:d>=0?['mid','Moderate buffer']:['lo','Low buffer'];
function impact(move){ // before/after at each touched interval (made-up numbers)
 return move.map(([t,req,b,a])=>{const d=a-req,[c,w]=lvl(d);return `<tr><td>${t}</td><td>${req}</td><td>${b}</td><td>${a}</td><td><span class="lv ${c}">${w}</span></td></tr>`}).join('')}
document.getElementById('out').innerHTML=`
<div class="opt"><h2>A. The associate: My day, change a break</h2>
<p>Only the running day, up to the end of the shift even past 00:00 (here 22:00 to 07:00 the next day). Only legal times are offered (the program's gaps between breaks). Each time shows how much spare cover the interval would have without them.</p>
<h3>Associate 014, shift 22:00 to 07:00 (Wed 14 Oct to Thu 15 Oct)</h3>
<div class="day"><span class="work" style="flex:4">22:00</span><span class="brk" style="flex:.5">B1</span><span class="work" style="flex:3">00:00</span><span class="brk" style="flex:1">Lunch</span><span class="work" style="flex:3">03:00</span><span class="brk" style="flex:.5">B2</span><span class="work" style="flex:3">05:00</span></div>
<p>Break 1 is planned 00:30 to 00:45. Pick another time for it:</p>
<div class="slots">
<span class="slot">23:30 <span class="lv hi">High buffer</span></span>
<span class="slot on">00:15 <span class="lv hi">High buffer</span></span>
<span class="slot">00:45 <span class="lv mid">Moderate buffer</span></span>
<span class="slot">01:15 <span class="lv lo">Low buffer</span></span>
<span class="slot">01:45 <span class="lv mid">Moderate buffer</span></span></div>
<p class="warn" role="status"><b>01:15 is likely to be rejected.</b> Only 4 are needed from 01:00 to 01:30 and 4 are planned, so nobody can step away. Pick a time marked High or Moderate.</p>
<p><span class="btn p">Send to the RTA</span><span class="btn">Cancel</span> Reason (optional): <span class="chip">Made-up: appointment</span></p>
<p>Your request: <b>Break 1, 00:30 to 00:15</b>, waiting for the RTA. You can cancel it until it is decided.</p></div>

<div class="opt"><h2>B. The RTA: Requests tab, break changes and coaching, with the impact</h2>
<p>The RTA sees the intervals the move touches, before and after, with the same buffer words. Approve changes the day on the RTA (as a break move or a coaching block); Reject asks for a reason the person sees.</p>
<h3>Break change: Associate 014, Break 1 from 00:30 to 00:15, Wed 14 Oct shift</h3>
<table><thead><tr><th>Interval</th><th>Needed</th><th>On the floor now</th><th>After this change</th><th>Buffer after</th></tr></thead><tbody>${impact([["00:00",5,7,6],["00:30",5,5,6]])}</tbody></table>
<p><span class="btn p">Approve</span><span class="btn">Reject</span> Reject needs a reason. Requested 20:41 by Associate 014.</p>
<h3>Coaching request: 2 associates, Thu 15 Oct 01:00 to 01:30, from Team manager 03 (Quality)</h3>
<table><thead><tr><th>Interval</th><th>Needed</th><th>On the floor now</th><th>After this change</th><th>Buffer after</th></tr></thead><tbody>${impact([["01:00",4,4,2],["01:30",4,6,6]])}</tbody></table>
<p class="warn">Two people leave the floor at 01:00; the interval would be 2 short. The RTA can still approve, or move it to a time with High buffer: 02:00 to 02:30.</p>
<p><span class="btn p">Approve</span><span class="btn">Reject</span><span class="btn">Suggest 02:00</span> Requester has the RTA role: <span class="chip">Approve my own request</span> is offered to them instead.</p></div>

<div class="opt"><h2>C. Team managers and departments: request coaching</h2>
<p>A new form on the Requests page for team managers (and department contacts, if you decide they get sign-ins): pick the associates, the day, the length and a time; each time shows the buffer for all the picked people together.</p>
<div class="sel"><label>Associates<span class="box">Associate 014, Associate 021 ▾</span></label><label>Day<span class="box">Thu 15 Oct (running day)</span></label><label>Length<span class="box">30 minutes ▾</span></label><label>Reason<span class="box">Made-up: call review</span></label></div>
<div class="slots"><span class="slot">02:00 <span class="lv hi">High buffer</span></span><span class="slot">02:30 <span class="lv hi">High buffer</span></span><span class="slot">03:00 <span class="lv mid">Moderate buffer</span></span><span class="slot">01:00 <span class="lv lo">Low buffer</span></span></div>
<p><span class="btn p">Send to the RTA</span> Your requests: coaching 02:00 to 02:30, <span class="lv mid">waiting for the RTA</span></p></div>`;
if(location.hash==='#dark'){document.body.className='dark'}
</script></body></html>
