<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Team Scheduler{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('home') }}">Team Scheduler</a>
  {% if user %}
  <nav>
    <a href="{{ url_for('home') }}">Runs</a>
    {% if user.is_admin %}<a href="{{ url_for('admin_users') }}">People</a>{% endif %}
    <a href="{{ url_for('change_password') }}">{{ user.display_name }}</a>
    <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="link">Sign out</button></form>
  </nav>
  {% endif %}
</header>
<main>
{% with messages = get_flashed_messages() %}{% for m in messages %}<p class="flash" role="status">{{ m }}</p>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main>
<footer class="foot">{{ copyright }}</footer>
</body>
</html>
