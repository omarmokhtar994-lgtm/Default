{% macro stagebar(run, small=False) -%}
<ol class="stagebar{% if small %} small{% endif %}" aria-label="Progress: {{ label(run) }}" data-run="{{ run.id }}">
{%- for name, state in stages(run) %}<li class="{{ state }}"><span>{{ name }}</span></li>{% endfor -%}
</ol>
{%- endmacro %}
